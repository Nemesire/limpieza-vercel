
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LimpiaBnB | Gestión Logística</title>
    
    <!-- Favicon para evitar error 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>">

    <!-- Tailwind CSS (Versión de producción) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* SOPORTE MANUAL PARA MODO OSCURO (Ya que el CDN estático no incluye variantes dark:) */
        .dark body { background-color: #020617; color: #f8fafc; }
        .dark .dark\:bg-slate-950 { background-color: #020617 !important; }
        .dark .dark\:bg-slate-900 { background-color: #0f172a !important; }
        .dark .dark\:bg-slate-800 { background-color: #1e293b !important; }
        .dark .dark\:text-white { color: #ffffff !important; }
        .dark .dark\:text-slate-200 { color: #e2e8f0 !important; }
        .dark .dark\:text-slate-300 { color: #cbd5e1 !important; }
        .dark .dark\:text-slate-400 { color: #94a3b8 !important; }
        .dark .dark\:border-slate-800 { border-color: #1e293b !important; }
        .dark .dark\:border-slate-700 { border-color: #334155 !important; }
        .dark .dark\:bg-blue-900\/20 { background-color: rgba(30, 58, 138, 0.2) !important; }
        .dark .dark\:bg-red-900\/20 { background-color: rgba(127, 17, 17, 0.2) !important; }
        .dark .dark\:bg-emerald-900\/20 { background-color: rgba(6, 78, 59, 0.2) !important; }
        .dark .dark\:bg-purple-900\/20 { background-color: rgba(88, 28, 135, 0.2) !important; }
        
        /* Asegurar que el scrollbar sea oscuro también */
        .dark ::-webkit-scrollbar { background: #0f172a; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
